# ─────────────────────────────────────────────────────────────
#  AI Signal — liste des sources
#
#  Chaque source a :
#    name        nom affiché
#    url         adresse du flux (ou de l'API / du sitemap)
#    tier        1 = primaire (labo, papier, texte officiel)
#                2 = presse / analyse fiable
#                3 = signal de découverte (jamais une source suffisante seule)
#    categories  catégories probables : models, tools, agents, research, business, policy
#    method      comment on lit la source :
#                  rss              flux RSS ou Atom
#                  sitemap          sitemap.xml du site (pour les sites sans RSS),
#                                   filtré avec "include" (début de chemin d'URL)
#                  arxiv            API arXiv
#                  hn_algolia       API Hacker News (Algolia)
#                  hf_papers        API Hugging Face Daily Papers
#                  github_trending  page GitHub Trending
#                  web_search       pas de flux : Claude cherche avec "site:" à l'étape d'enquête
#    filter      (optionnel) "ai" = ne garder que les éléments qui parlent d'IA
#                (utile pour les sources généralistes)
#    date_lag_hours (optionnel) décale la fenêtre dans le passé (sources publiées en retard)
#    enabled     (optionnel) false pour désactiver une source sans la supprimer
#    note        (optionnel) commentaire libre
#
#  Pour AJOUTER une source : copie un bloc, change les valeurs, puis lance
#     python -m ai_signal check-sources
#  pour vérifier qu'elle répond.
# ─────────────────────────────────────────────────────────────

# Mots-clés utilisés par filter: ai (insensibles à la casse, mots entiers).
ai_keywords:
  - AI
  - artificial intelligence
  - machine learning
  - deep learning
  - neural
  - LLM
  - LLMs
  - language model
  - foundation model
  - generative
  - GenAI
  - chatbot
  - agent
  - agents
  - agentic
  - GPT
  - ChatGPT
  - OpenAI
  - Anthropic
  - Claude
  - Gemini
  - DeepMind
  - Llama
  - Mistral
  - DeepSeek
  - Qwen
  - transformer
  - diffusion
  - MCP
  - inference
  - fine-tuning
  - RAG
  - embedding
  - embeddings
  - copilot
  - AI Act

