[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-signal"
version = "0.1.0"
description = "Agent de veille IA quotidienne : collecte, tri, vérification, page web et email."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8,<3",      # SDK officiel Claude (Messages API)
    "pydantic>=2.7,<3",       # validation des sorties JSON
    "httpx>=0.27,<1",         # requêtes HTTP pour la collecte
    "feedparser>=6.0,<7",     # lecture des flux RSS / Atom
    "PyYAML>=6.0,<7",         # fichiers de configuration
    "Jinja2>=3.1,<4",         # rendu HTML (page + email)
    "python-dotenv>=1.0,<2",  # lecture du fichier .env en local
    "rapidfuzz>=3.6,<4",      # similarité de titres (dédoublonnage)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
